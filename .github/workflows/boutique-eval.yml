# Boutique agent eval.
#   regression: on pull requests that touch the exercise, and on manual dispatch, runs the offline
#               unit tests, the grader sanity checks, then the 32-task suite 3 times, and fails the
#               check if the mean pass rate is below MIN_PASS_RATE or any attempt errored.
#   heldout:    nightly (and on demand), runs both held-out sets and reports the scores without
#               failing the build on them. A crash or a missing key still fails the job.
# Needs the repository secret ANTHROPIC_API_KEY. A missing key fails the job on same-repo runs.
# Pull requests from forks get no secrets: the regression job runs only the offline unit tests,
# writes "NOT RUN" to the job summary and reports success without running the eval.
name: boutique-eval

on:
  pull_request:
    paths:
      - "day2/01_evals/**"
      - ".github/workflows/boutique-eval.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boutique-eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: day2/01_evals

env:
  MIN_PASS_RATE: "0.97"

jobs:
  regression:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline unit tests
        run: python -m unittest test_run_eval -v

      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$FROM_FORK" = "true" ]; then
            echo "::warning::No API key on a pull request from a fork. The eval was NOT RUN."
            echo "## NOT RUN: no API key on a pull request from a fork" >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ANTHROPIC_API_KEY is not set. Add it as a repository secret."
            exit 1
          fi

      - name: Create venv (the notebook's setup cell refuses to install outside one)
        if: steps.key.outputs.available == 'true'
        run: python -m venv .venv

      - name: Remove committed results so the artifact holds only this run
        if: steps.key.outputs.available == 'true'
        run: rm -rf eval_results

      - name: Grader sanity checks
        if: steps.key.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/python -I run_eval.py sanity

      - name: Regression suite
        if: steps.key.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/python -I run_eval.py baseline --runs 3 --min-pass-rate "$MIN_PASS_RATE"

      - name: Upload results
        if: always() && steps.key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-regression
          path: day2/01_evals/eval_results/
          if-no-files-found: error

  heldout:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv
        run: python -m venv .venv

      - name: Remove committed results so the artifact holds only this run
        run: rm -rf eval_results

      - name: Held-out sets (report only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it as a repository secret."
            exit 1
          fi
          for stage in heldout heldout2 heldout3; do
            out="$RUNNER_TEMP/$stage.txt"
            if ! .venv/bin/python -I run_eval.py "$stage" --runs 3 > "$out" 2>&1; then
              cat "$out"
              exit 1
            fi
            cat "$out"
          done
          {
            echo '## Held-out scores'
            for stage in heldout heldout2 heldout3; do
              echo "### $stage"
              echo '```'
              sed -n '/Per-task pass rate/,$p' "$RUNNER_TEMP/$stage.txt"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-heldout
          path: day2/01_evals/eval_results/
          if-no-files-found: error
